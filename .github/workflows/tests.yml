# Catches a formula that no longer parses or that breaks Homebrew's style
# rules. It deliberately does not build anything: Scribe needs Xcode 26 on
# Apple Silicon, which the hosted runners cannot give us.
name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  tap-syntax:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-tap-syntax
